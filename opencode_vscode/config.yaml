name: OpenCode VS Code Tunnel
version: "0.9.0"
slug: opencode_vscode
description: Tunnel VS Code (auth GitHub) et serveur OpenCode sur Home Assistant
url: https://github.com/Edenglish92/ha-opencode/tree/main/opencode_vscode
image: ghcr.io/edenglish92/opencode-vscode-tunnel
arch:
  - aarch64
  - amd64
init: false
map:
  - type: share
    read_only: false
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  tunnel_name: opencode
  accept_license: true
  opencode_password: ""
  public_url: ""
  ha_mcp_url: ""
  opencode_version: "2.3.0"
  default_agent: plan
  default_model: ""
  hardening_deny_secrets: true
  hardening_ask_config_edit: false
  hardening_ask_shell: false
  hardening_deny_paths: []
  seed_agents_md: true
  install_opencode_extension: true
  assist_agent_enabled: true
schema:
  tunnel_name: str
  accept_license: bool
  opencode_password: password
  public_url: str
  ha_mcp_url: password
  opencode_version: str
  default_agent: str
  default_model: str
  hardening_deny_secrets: bool
  hardening_ask_config_edit: bool
  hardening_ask_shell: bool
  hardening_deny_paths:
    - str
  seed_agents_md: bool
  install_opencode_extension: bool
  assist_agent_enabled: bool
