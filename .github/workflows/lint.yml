name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon-linter:
    name: Home Assistant add-on linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809  # v2
        with:
          path: "./opencode_vscode"
      - name: Lint read-only add-on
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809  # v2
        with:
          path: "./opencode_vscode_ro"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: "./opencode_vscode"

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: opencode_vscode/Dockerfile

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          file_or_dir: opencode_vscode
          config_file: .yamllint
      - name: Lint read-only add-on YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3
        with:
          file_or_dir: opencode_vscode_ro
          config_file: .yamllint

  versions:
    name: Add-on versions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Compare versions
        run: |
          rw="$(sed -n 's/^version:[[:space:]]*"\(.*\)"$/\1/p' opencode_vscode/config.yaml | head -n1)"
          ro="$(sed -n 's/^version:[[:space:]]*"\(.*\)"$/\1/p' opencode_vscode_ro/config.yaml | head -n1)"
          echo "opencode_vscode=${rw:-<empty>} opencode_vscode_ro=${ro:-<empty>}"
          if [ -z "$rw" ] || [ -z "$ro" ]; then
            echo "::error::Could not read one of the versions"
            exit 1
          fi
          if [ "$rw" != "$ro" ]; then
            echo "::error::Versions differ ($rw vs $ro); both apps share one image"
            exit 1
          fi

      - name: Validate assist agent JSON
        run: jq -e . opencode_vscode/config/assist-agent.json >/dev/null

  changelog:
    name: Changelog copies match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Compare changelog copies
        run: |
          status=0
          for file in opencode_vscode/CHANGELOG.md opencode_vscode_ro/CHANGELOG.md; do
            if ! diff -q CHANGELOG.md "$file"; then
              echo "::error::$file differs from the root CHANGELOG.md"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Copy CHANGELOG.md into both app folders (the Supervisor reads it there)."
            exit 1
          fi
          echo "All changelog copies are identical."

      # Une release tire ses notes de la premiere section du CHANGELOG. Sans ce
      # controle, une version peut etre bumpee sans entree et la release nait
      # avec un corps generique.
      - name: Top changelog section matches the add-on version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*"\(.*\)"$/\1/p' opencode_vscode/config.yaml | head -n1)"
          section="$(grep -m1 '^## ' CHANGELOG.md | sed 's/^##[[:space:]]*//')"
          echo "config.yaml=${version:-<vide>} / CHANGELOG=${section:-<vide>}"
          if [ -z "$version" ] || [ -z "$section" ]; then
            echo "::error::Could not read the version or the first CHANGELOG section."
            exit 1
          fi
          if [ "$version" != "$section" ]; then
            echo "::error::The first CHANGELOG section ($section) does not match config.yaml ($version). Add the section before bumping."
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
