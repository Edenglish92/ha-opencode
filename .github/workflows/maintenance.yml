name: Monthly refresh

on:
  schedule:
    # 1st of each month, 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Bump patch version and rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          file="opencode_vscode/config.yaml"
          current="$(sed -n 's/^version:[[:space:]]*"\(.*\)"$/\1/p' "$file" | head -n1)"
          if [ -z "$current" ]; then
            echo "::error::Could not read version from $file"
            exit 1
          fi
          major="${current%%.*}"
          rest="${current#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next="${major}.${minor}.$((patch + 1))"
          sed -i "s/^version:[[:space:]]*\"${current}\"$/version: \"${next}\"/" "$file"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencode_vscode/config.yaml
          if git diff --cached --quiet; then
            echo "No version change, nothing to do."
            exit 0
          fi
          git commit -m "chore: monthly refresh ${{ steps.bump.outputs.next }}"
          git push
