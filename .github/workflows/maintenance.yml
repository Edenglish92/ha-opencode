name: Monthly refresh

on:
  schedule:
    # 1st of each month, 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch Lint: a push made with GITHUB_TOKEN does not trigger
  # workflows, but workflow_dispatch does (documented GitHub exception).
  actions: write

jobs:
  bump:
    name: Bump patch version and rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          primary="opencode_vscode/config.yaml"
          secondary="opencode_vscode_ro/config.yaml"

          current="$(sed -n 's/^version:[[:space:]]*"\(.*\)"$/\1/p' "$primary" | head -n1)"
          other="$(sed -n 's/^version:[[:space:]]*"\(.*\)"$/\1/p' "$secondary" | head -n1)"
          if [ -z "$current" ]; then
            echo "::error::Could not read version from $primary"
            exit 1
          fi
          if [ "$current" != "$other" ]; then
            echo "::error::Version mismatch: $primary=$current, $secondary=$other"
            exit 1
          fi

          major="${current%%.*}"
          rest="${current#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next="${major}.${minor}.$((patch + 1))"

          for file in "$primary" "$secondary"; do
            sed -i "s/^version:[[:space:]]*\"${current}\"$/version: \"${next}\"/" "$file"
          done

          # La release creee par la CI lit sa section dans CHANGELOG.md : sans
          # entree, les notes seraient vides. On en ajoute une, generique.
          if ! grep -q "^## ${next}$" CHANGELOG.md; then
            awk -v v="$next" 'NR==1 { print; print ""; print "## " v; print "";
                               print "- Monthly refresh: image rebuilt from the Debian base and current packages."; next }
                              { print }' CHANGELOG.md > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
          fi
          cp CHANGELOG.md opencode_vscode/CHANGELOG.md
          cp CHANGELOG.md opencode_vscode_ro/CHANGELOG.md

          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencode_vscode/config.yaml opencode_vscode_ro/config.yaml \
                  CHANGELOG.md opencode_vscode/CHANGELOG.md opencode_vscode_ro/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No version change, nothing to do."
            exit 0
          fi
          git commit -m "chore: monthly refresh ${{ steps.bump.outputs.next }}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The push above uses GITHUB_TOKEN, so it does not trigger Lint (and
      # therefore nor Build). workflow_dispatch is the documented exception:
      # dispatch Lint explicitly on the commit that was just pushed, then make
      # sure the run really exists so a silent stop shows up as a red job.
      - name: Trigger Lint on the new commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh workflow run lint.yml --ref main
          echo "Lint dispatched for $sha; waiting for the run to register..."

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/lint.yml/runs?head_sha=${sha}&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "::error::No Lint run appeared for $sha: the image would not be built."
            exit 1
          fi
          echo "Lint run $run_id queued for $sha"
