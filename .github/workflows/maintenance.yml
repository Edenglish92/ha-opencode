name: Monthly refresh

on:
  schedule:
    # 1st of each month, 04:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Bump patch version and rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          primary="opencode_vscode/config.yaml"
          secondary="opencode_vscode_ro/config.yaml"

          current="$(sed -n 's/^version:[[:space:]]*"\(.*\)"$/\1/p' "$primary" | head -n1)"
          other="$(sed -n 's/^version:[[:space:]]*"\(.*\)"$/\1/p' "$secondary" | head -n1)"
          if [ -z "$current" ]; then
            echo "::error::Could not read version from $primary"
            exit 1
          fi
          if [ "$current" != "$other" ]; then
            echo "::error::Version mismatch: $primary=$current, $secondary=$other"
            exit 1
          fi

          major="${current%%.*}"
          rest="${current#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next="${major}.${minor}.$((patch + 1))"

          for file in "$primary" "$secondary"; do
            sed -i "s/^version:[[:space:]]*\"${current}\"$/version: \"${next}\"/" "$file"
          done
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencode_vscode/config.yaml opencode_vscode_ro/config.yaml
          if git diff --cached --quiet; then
            echo "No version change, nothing to do."
            exit 0
          fi
          git commit -m "chore: monthly refresh ${{ steps.bump.outputs.next }}"
          git push
